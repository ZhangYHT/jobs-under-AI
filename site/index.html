<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 时代各岗位冲击图谱 · 中国版</title>
<style>
  :root{--r:13px;--bg:#0a0d14;--bg2:#0e1320;--panel:#141a28;--panel2:#1a2233;--line:#283246;
    --text:#e9edf6;--muted:#93a0ba;--soft:#6b7896;--accent:#6ea8fe;--accent2:#9b8cff;
    --shadow:0 10px 30px rgba(0,0,0,.45);--glass:rgba(13,18,30,.92);}
  html[data-theme="light"]{--bg:#eef1f7;--bg2:#f6f8fc;--panel:#fff;--panel2:#f1f4fa;--line:#e2e7f1;
    --text:#1b2333;--muted:#5d6a82;--soft:#8a96ac;--accent:#3b6fe0;--accent2:#7b5cf0;
    --shadow:0 8px 26px rgba(40,60,110,.12);--glass:rgba(255,255,255,.93);}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  #stage{position:fixed;inset:0;background:linear-gradient(180deg,var(--panel),var(--bg2));}
  #cv{display:block;width:100%;height:100%;}
  .pill{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.16s;white-space:nowrap;}
  .pill:hover{border-color:var(--accent);transform:translateY(-1px);}
  /* 顶栏 + 抽屉手柄 */
  #top{position:fixed;top:8px;left:8px;right:8px;z-index:30;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 13px;max-height:74vh;overflow:auto;
    transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .32s;}
  #top.collapsed{transform:translateY(calc(-100% - 40px));opacity:0;pointer-events:none;}
  #handle{position:fixed;top:0;left:50%;z-index:33;transform:translateX(-50%);transform-origin:top center;
    background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-top:none;border-radius:0 0 13px 13px;
    padding:4px 26px 5px;cursor:pointer;box-shadow:var(--shadow);color:var(--muted);font-size:13px;font-weight:700;user-select:none;transition:padding .15s;}
  #handle:hover{color:var(--accent);}
  #backTab{position:fixed;left:0;top:50%;z-index:33;transform:translateY(-50%);transform-origin:left center;display:none;
    background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-left:none;border-radius:0 14px 14px 0;
    padding:18px 9px 18px 6px;cursor:pointer;box-shadow:var(--shadow);color:var(--accent);font-size:20px;font-weight:800;user-select:none;}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .head h1{font-size:15.5px;margin:0;font-weight:800;background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;}
  .head .sub{font-size:11px;color:var(--muted);}
  .head .sp{flex:1;}
  .row1{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px;}
  .search{position:relative;}
  .search input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 12px 7px 30px;font-size:12.5px;width:160px;outline:none;transition:.16s;}
  .search input:focus{border-color:var(--accent);width:200px;}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.55;}
  .tg{display:flex;flex-wrap:wrap;gap:6px;}
  .tg button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:.16s;}
  .tg button:hover{color:var(--text);}
  .tg button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;font-weight:700;}
  .tg button.extra{border-style:dashed;border-color:var(--accent2);}
  .sw{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:8px;user-select:none;}
  .sw .dot{width:30px;height:16px;border-radius:20px;background:var(--line);position:relative;transition:.2s;}
  .sw .dot::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.2s;}
  .sw.on .dot{background:linear-gradient(135deg,var(--accent),var(--accent2));}.sw.on .dot::after{left:16px;}
  .legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-left:auto;}
  .legend .bar{width:120px;height:11px;border-radius:6px;}
  .cards{display:grid;grid-template-columns:1.1fr 1fr 1.1fr 1fr;gap:10px;}
  @media(max-width:880px){.cards{grid-template-columns:1fr 1fr;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;}
  .card .ct{font-size:10.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;}
  .num .v{font-size:18px;font-weight:800;line-height:1.05;}.num .k{font-size:9.5px;color:var(--muted);}
  #radarc,#tierc{width:100%;height:104px;display:block;}
  #hist{display:flex;align-items:flex-end;gap:5px;height:104px;}
  .hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end;height:100%;}
  .hb .b{width:100%;border-radius:4px 4px 1px 1px;min-height:2px;transition:height .5s cubic-bezier(.22,1,.36,1);}
  .hb .l{font-size:8px;color:var(--soft);}
  /* 大类总览(并入顶栏) */
  .daRow{margin-top:10px;}
  .daRow .ct{font-size:10.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .daGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  @media(max-width:880px){.daGrid{grid-template-columns:repeat(2,1fr);}}
  .dac{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;transition:.14s;}
  .dac:hover{border-color:var(--accent);transform:translateY(-1px);}
  .dac .t{display:flex;justify-content:space-between;font-size:11.5px;align-items:center;}.dac .t b{font-variant-numeric:tabular-nums;}
  .dac .track{height:5px;border-radius:4px;background:var(--panel2);margin-top:4px;overflow:hidden;}.dac .fill{height:100%;border-radius:4px;}
  .dac .sm{font-size:9.5px;color:var(--soft);margin-top:4px;line-height:1.4;max-height:26px;overflow:hidden;}
  /* 中类详情(顶栏内) */
  #detailview{display:none;gap:16px;align-items:flex-start;}
  #top.detail .cards,#top.detail .daRow{display:none;}#top.detail #detailview{display:flex;}
  .dv-l{flex:1.1;min-width:0;}.dv-m{width:184px;flex:none;}.dv-r{flex:1.4;min-width:0;}
  #detailview h3{margin:0 0 2px;font-size:17px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  #detailview .meta{color:var(--muted);font-size:11.5px;margin-bottom:7px;}
  #dvradar{width:184px;height:150px;}#dvbars{width:100%;height:120px;}
  .dimrow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed var(--line);}.dimrow b{font-variant-numeric:tabular-nums;}
  .kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 8px;font-size:12px;color:var(--muted);margin:7px 0;}.kv b{color:var(--text);}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:7px;margin:0 5px 5px 0;border:1px solid var(--line);background:var(--panel2);}
  .chip i{width:9px;height:9px;border-radius:50%;}.chip b{font-variant-numeric:tabular-nums;}
  .rat{font-size:12px;font-style:italic;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;line-height:1.55;margin-top:6px;}
  .src{font-size:10.5px;color:var(--soft);line-height:1.5;margin-top:6px;}
  .tag{font-size:10px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:1px 7px;border-radius:6px;font-weight:600;}
  .tag.green{background:rgba(80,200,120,.16);color:#5bd08a;border-color:rgba(80,200,120,.4);}
  .tag.warn{background:rgba(245,170,70,.16);color:#e6a94d;border-color:rgba(245,170,70,.4);}
  #crumb{position:fixed;left:12px;bottom:10px;z-index:25;font-size:12px;color:var(--muted);background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:5px 11px;}
  #crumb a{color:var(--accent);cursor:pointer;}#crumb a:hover{text-decoration:underline;}
  #tip{position:fixed;pointer-events:none;z-index:40;background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow);display:none;width:250px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  #tip.show{display:block;}
  #tip .t{font-size:13.5px;font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  #tip .big{font-weight:700;margin:2px 0;}
  #tip .grid{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px;color:var(--muted);margin-top:5px;}#tip .grid b{color:var(--text);font-variant-numeric:tabular-nums;}
  #tipr{width:100%;height:150px;margin-top:6px;}#tip .mods{margin-top:6px;}
  #tip .r{margin-top:6px;font-style:italic;border-top:1px solid var(--line);padding-top:5px;color:var(--text);line-height:1.5;}
  #tip .hint{margin-top:5px;font-size:10.5px;color:var(--soft);}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:40px;}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="err">未能加载数据(data.cn.js)。请先运行 <b>python aggregate.py</b>。</div>
<div id="handle">⌃</div>
<div id="backTab" title="返回全部职业">‹</div>

<div id="top">
  <div class="head"><h1>AI 时代各岗位冲击图谱 · 中国版</h1><div class="sub" id="sub"></div><div class="sp"></div><button class="pill" id="themebtn">🌗 跟随设备</button></div>
  <div class="row1">
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="搜索职业…"></div>
    <div class="tg" id="tg"></div>
    <div class="sw" id="disagree"><span class="dot"></span>模型分歧</div>
    <div class="legend"><span id="legLo">低</span><div class="bar" id="legbar"></div><span>高</span><span id="legNote" style="margin-left:3px"></span></div>
  </div>
  <div class="cards">
    <div class="card"><div class="ct">概况(当前视图)</div><div class="grid2">
      <div class="num"><div class="v" id="sJobs">–</div><div class="k">覆盖就业</div></div>
      <div class="num"><div class="v" id="sAvg">–</div><div class="k">加权综合冲击</div></div>
      <div class="num"><div class="v" id="sCnt">–</div><div class="k">中类数</div></div>
      <div class="num"><div class="v" id="sTop" style="font-size:12px">–</div><div class="k">冲击最高</div></div>
    </div></div>
    <div class="card"><div class="ct">六维画像(就业加权)</div><canvas id="radarc"></canvas></div>
    <div class="card"><div class="ct">综合冲击分布(按就业)</div><div id="hist"></div></div>
    <div class="card"><div class="ct">就业 · 按冲击分层</div><canvas id="tierc"></canvas></div>
  </div>
  <div class="daRow"><div class="ct">八大类 · AI 综合冲击(就业加权,点击进入)</div><div class="daGrid" id="daGrid"></div></div>
  <div id="detailview">
    <div class="dv-l"><h3 id="dName">—</h3><div class="meta" id="dMeta"></div><div id="dDims"></div><div class="kv" id="dKv"></div></div>
    <div class="dv-m"><canvas id="dvradar"></canvas></div>
    <div class="dv-r"><div style="font-size:11px;color:var(--muted);margin-bottom:4px" id="dModelsH"></div><canvas id="dvbars"></canvas><div id="dModels" style="margin-top:5px"></div><div class="rat" id="dRat"></div><div class="src" id="dSrc"></div></div>
  </div>
</div>

<div id="crumb"></div>
<div id="tip"></div>

<script src="data.cn.js"></script>
<script>
if(!window.DATA){document.getElementById('err').style.display='flex';}
else{(function(){
const DATA=window.DATA,DASUM=DATA.da_summary||{};
const DIMS=[{key:'overall',label:'综合冲击',short:'综合',main:1},{key:'automation',label:'任务自动化',short:'自动化'},
  {key:'augmentation',label:'AI增强',short:'AI增强'},{key:'digital',label:'数字化程度',short:'数字化'},
  {key:'moat',label:'护城河',short:'护城河',note:'红=护城河强'},{key:'adoption',label:'落地速度',short:'落地'}];
const DIMKEYS=DIMS.map(d=>d.key);
const EDU={'博士':6,'硕士':5,'本科':4,'大专':3,'高中':2,'初中':1};
const METRICS=[...DIMS,{key:'pay',label:'薪资',extra:1},{key:'education',label:'学历',extra:1}];
const SCOREM=[...new Set(DATA.groups.flatMap(g=>Object.keys(g.by_model||{})))];
document.getElementById('sub').innerHTML='就业=七普 · 薪资=统计局 · 分类=大典2022 · AI冲击='+SCOREM.length+'模型集成';
const byDa={};DATA.groups.forEach(g=>{(byDa[g.parent]=byDa[g.parent]||[]).push(g);});
const TREE=DATA.categories.map(c=>({code:c.code,name:c.title,children:(byDa[c.code]||[]).filter(g=>g.employment)})).filter(d=>d.children.length);
const ALLZ=[];TREE.forEach(d=>d.children.forEach(g=>{g.da=d.name;g.daCode=d.code;g.name=g.title;ALLZ.push(g);}));
const DA=TREE.map(d=>{const t=d.children.reduce((s,g)=>s+(g.employment||0),0)||1;
  return {code:d.code,name:d.name,jobs:t,overall:Math.round(d.children.reduce((s,g)=>s+(g.dims.overall||0)*(g.employment||0),0)/t),children:d.children,summary:(DASUM[d.code]||{}).summary||''};}).sort((a,b)=>b.overall-a.overall);

const S={dim:'overall',drill:null,disagree:false,query:''};
const mq=matchMedia('(prefers-color-scheme: dark)');let themeMode='auto';
const theme=()=>themeMode==='auto'?(mq.matches?'dark':'light'):themeMode;
const RAMP={dark:[[45,212,191],[150,222,80],[245,200,70],[247,150,80],[240,75,100]],light:[[20,170,150],[120,185,55],[225,170,40],[230,120,55],[220,55,85]]};
const UNCERT={dark:[[120,135,165],[140,150,250],[150,90,240]],light:[[150,160,180],[120,120,235],[120,60,210]]};
const lerpC=(r,t)=>{t=Math.max(0,Math.min(1,t));const s=r.length-1,x=t*s,i=Math.min(s-1,Math.floor(x)),f=x-i,a=r[i],b=r[i+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];};
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const lum=c=>(0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtJobs=n=>n>=1e8?(n/1e8).toFixed(2)+'亿':Math.round(n/1e4)+'万';
const colorAbs=v=>rgb(lerpC(RAMP[theme()],Math.pow((v||0)/100,0.9)));
let RANGE=[0,100];
const rawMetric=n=>S.dim==='pay'?(n.pay?Math.log(n.pay):null):S.dim==='education'?(EDU[n.education]||null):(n.dims?n.dims[S.dim]:null);
function updateRange(){const vs=ALLZ.map(rawMetric).filter(v=>v!=null&&!isNaN(v));const mn=Math.min(...vs),mx=Math.max(...vs);RANGE=[mn,mx>mn?mx:mn+1];}
function metricV(n){const r=rawMetric(n),c01=r==null?0:Math.max(0,Math.min(1,(r-RANGE[0])/(RANGE[1]-RANGE[0])));
  let label;if(S.dim==='pay')label=n.pay?(n.pay>=1e4?Math.round(n.pay/1e4)+'万':n.pay):'—';else if(S.dim==='education')label=n.education||'—';else label=n.dims?n.dims[S.dim]:'—';return{c01,label};}
const tileRGB=t=>S.disagree?lerpC(UNCERT[theme()],(t.node.std||0)/12):lerpC(RAMP[theme()],Math.pow(metricV(t.node).c01,0.78));

const worst=(r,s)=>{const sum=r.reduce((a,b)=>a+b,0),mx=Math.max(...r),mn=Math.min(...r);return Math.max(s*s*mx/(sum*sum),sum*sum/(s*s*mn));};
function squarify(it,x,y,w,h){const out=[],L=it.filter(i=>i.value>0).sort((a,b)=>b.value-a.value);const tot=L.reduce((s,i)=>s+i.value,0);if(tot<=0||w<=0||h<=0)return out;
  const sc=w*h/tot,ar=L.map(i=>i.value*sc);let i=0,cx=x,cy=y,cw=w,ch=h;
  while(i<L.length){const sd=Math.min(cw,ch);let row=[ar[i]],rf=[L[i]];i++;while(i<L.length){if(worst(row.concat(ar[i]),sd)<=worst(row,sd)){row.push(ar[i]);rf.push(L[i]);i++;}else break;}
    const sm=row.reduce((a,b)=>a+b,0);if(cw>=ch){const cW=sm/ch;let oy=cy;for(let k=0;k<row.length;k++){const cH=row[k]/cW;out.push({ref:rf[k].ref,x:cx,y:oy,w:cW,h:cH});oy+=cH;}cx+=cW;cw-=cW;}
    else{const rH=sm/cw;let ox=cx;for(let k=0;k<row.length;k++){const cW=row[k]/rH;out.push({ref:rf[k].ref,x:ox,y:cy,w:cW,h:rH});ox+=cW;}cy+=rH;ch-=rH;}}return out;}

const stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let DPR=Math.max(1,window.devicePixelRatio||1),tiles=[],daLabels=[],hoverId=null;
const W=()=>cv.width/DPR,H=()=>cv.height/DPR;
const full=()=>({x:6,y:6,w:W()-12,h:H()-12});
function resize(){const r=stage.getBoundingClientRect();cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);rebuild(full());}
function computeTargets(){const T=[],L=[],pad=6;
  if(!S.drill){squarify(TREE.map(d=>({value:d.children.reduce((s,g)=>s+g.employment,0),ref:d})),pad,pad,W()-2*pad,H()-2*pad).forEach(dr=>{
    const da=dr.ref,lh=dr.h>56?20:0;L.push({name:da.name,jobs:da.children.reduce((s,g)=>s+g.employment,0),x:dr.x,y:dr.y,w:dr.w,h:dr.h,lh});
    const ir={x:dr.x+4,y:dr.y+3+lh,w:dr.w-8,h:dr.h-6-lh};
    squarify(da.children.map(g=>({value:g.employment,ref:g})),ir.x,ir.y,ir.w,ir.h).forEach(t=>T.push({id:'z:'+t.ref.code,node:t.ref,kind:'zhong',tx:t.x,ty:t.y,tw:t.w,th:t.h}));});}
  else{const g=ALLZ.find(x=>x.code===S.drill);const kids=g['细类']||[];const anyS=kids.some(k=>k.overall!=null);
    kids.length&&squarify(kids.map(k=>({value:anyS?(k.employment||1):1,ref:k})),pad,pad,W()-2*pad,H()-2*pad).forEach(t=>{const k=t.ref,sc=k.overall!=null;
      const node=sc?{name:k.title,title:k.title,code:k.code,S:k.digital,green:k.green,dims:k.dims,std:k.std,employment:k.employment,pay:k.pay,education:k.education,level:k.level,by_model:k.by_model,rationales:k.rationales,n_models:k.n_models}
        :{name:k.title,S:k.digital,green:k.green,dims:g.dims,std:g.std,inherit:g.title,pay:g.pay,education:g.education};
      T.push({id:'l:'+k.code,node:node,kind:'leaf',tx:t.x,ty:t.y,tw:t.w,th:t.h});});}
  return{T,L};}
function rebuild(o){const{T,L}=computeTargets();daLabels=L;const m=new Map(tiles.map(t=>[t.id,t]));
  T.forEach(t=>{const p=m.get(t.id);if(p){Object.assign(t,{cx:p.cx,cy:p.cy,cw:p.cw,ch:p.ch,alpha:p.alpha,cr:p.cr,cg:p.cg,cb:p.cb,hl:p.hl||0});}
    else{const c=tileRGB(t);Object.assign(t,{cx:o.x,cy:o.y,cw:o.w,ch:o.h,alpha:0,cr:c[0],cg:c[1],cb:c[2],hl:0});}});tiles=T;}
const matches=t=>!S.query||t.node.name.toLowerCase().includes(S.query.toLowerCase())||(t.kind==='zhong'&&(t.node['细类']||[]).some(k=>k.title.toLowerCase().includes(S.query.toLowerCase())));
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(name,maxW,maxLines){const out=[];let cur='';for(const ch of name){if(ctx.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch;if(out.length===maxLines-1){if(ctx.measureText(cur).width>maxW){while(cur&&ctx.measureText(cur+'…').width>maxW)cur=cur.slice(0,-1);cur+='…';}out.push(cur);return out;}}else cur+=ch;}if(cur)out.push(cur);return out;}
function paintTile(x,y,w,h,c,node,hl,alpha){ctx.globalAlpha=alpha;ctx.save();if(hl>.02){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=18*hl;ctx.shadowOffsetY=6*hl;}

  ctx.globalAlpha=alpha;ctx.lineWidth=1+1.8*hl;ctx.strokeStyle=hl>.02?(theme()==='dark'?'rgba(255,255,255,'+(.3+.5*hl)+')':'rgba(30,40,70,'+(.25+.4*hl)+')'):(theme()==='dark'?'rgba(8,11,18,.5)':'rgba(255,255,255,.7)');rr(x+1,y+1,w-2,h-2,5);ctx.stroke();
  if(w>44&&h>22){const drk=lum(c)<.55;ctx.fillStyle=drk?'rgba(255,255,255,.96)':'rgba(15,20,30,.93)';ctx.textBaseline='top';
    const fs=w<82?10.5:11.5;ctx.font=fs+'px sans-serif';const lines=wrap(node.name,w-9,Math.max(1,Math.min(3,Math.floor((h-20)/(fs+2)))));
    lines.forEach((ln,i)=>ctx.fillText(ln,x+5,y+4+i*(fs+2)));
    ctx.font='bold 13px sans-serif';ctx.fillText(S.disagree?('±'+(node.std||0)):metricV(node).label,x+5,y+4+lines.length*(fs+2)+1);
    if(node.S&&w>72){ctx.font='9px sans-serif';ctx.globalAlpha=alpha*.85;ctx.fillStyle=drk?'rgba(255,255,255,.7)':'rgba(15,20,30,.6)';ctx.fillText('S',x+w-12,y+5);ctx.globalAlpha=alpha;}}}
function fitRect(t){const nm=t.node.name;ctx.font='11.5px sans-serif';const fw=ctx.measureText(nm).width;
  let tw=Math.min(W()-12,Math.max(t.cw*1.08,Math.min(182,fw/2+16))),th=Math.max(t.ch*1.08,50);
  let cx=t.cx+t.cw/2,cy=t.cy+t.ch/2,x=cx-tw/2,y=cy-th/2;x=Math.max(4,Math.min(W()-tw-4,x));y=Math.max(4,Math.min(H()-th-4,y));return{x,y,w:tw,h:th};}
function frame(){for(const t of tiles){t.cx+=(t.tx-t.cx)*.22;t.cy+=(t.ty-t.cy)*.22;t.cw+=(t.tw-t.cw)*.22;t.ch+=(t.th-t.ch)*.22;
  t.alpha+=((matches(t)?1:.12)-t.alpha)*.18;const c=tileRGB(t);t.cr+=(c[0]-t.cr)*.16;t.cg+=(c[1]-t.cg)*.16;t.cb+=(c[2]-t.cb)*.16;t.hl+=((t.id===hoverId?1:0)-t.hl)*.2;}

    let s=d.name+'  ·  '+fmtJobs(d.jobs),mw=d.w-12;while(ctx.measureText(s).width>mw&&s.length>1)s=s.slice(0,-1);ctx.fillText(s,d.x+8,d.y+5);}});

function drawRadar(canvas,vals){const c=canvas.getContext('2d'),r=canvas.getBoundingClientRect();if(r.width<2||r.height<2)return;canvas.width=r.width*DPR;canvas.height=r.height*DPR;c.setTransform(DPR,0,0,DPR,0,0);
  const w=r.width,h=r.height,cx=w/2,cy=h/2+2,R=Math.min(w,h)/2-15,n=6,ln=theme()==='dark'?'rgba(255,255,255,.13)':'rgba(20,30,60,.13)',tx=cssv('--muted');
  c.clearRect(0,0,w,h);for(let g=1;g<=3;g++){c.beginPath();for(let i=0;i<=n;i++){const a=-Math.PI/2+i*2*Math.PI/n,rr=R*g/3;const X=cx+Math.cos(a)*rr,Y=cy+Math.sin(a)*rr;i?c.lineTo(X,Y):c.moveTo(X,Y);}c.closePath();c.strokeStyle=ln;c.stroke();}
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;c.fillStyle=tx;c.font='9px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(DIMS[i].short,cx+Math.cos(a)*(R+9),cy+Math.sin(a)*(R+7));}
  const ac=cssv('--accent');c.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,rr=R*Math.max(0,Math.min(100,vals[i]))/100;const X=cx+Math.cos(a)*rr,Y=cy+Math.sin(a)*rr;i?c.lineTo(X,Y):c.moveTo(X,Y);}c.closePath();c.fillStyle=ac+'44';c.strokeStyle=ac;c.lineWidth=2;c.fill();c.stroke();}
function drawBars(canvas,g){const c=canvas.getContext('2d'),r=canvas.getBoundingClientRect();if(r.width<2||r.height<2)return;canvas.width=r.width*DPR;canvas.height=r.height*DPR;c.setTransform(DPR,0,0,DPR,0,0);
  const arr=SCOREM.map(m=>({m,v:g.by_model&&g.by_model[m]?g.by_model[m].overall:null})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  const w=r.width,h=r.height,n=arr.length;if(!n)return;const bw=Math.min(26,(w-(n-1)*4)/n),gap=(w-bw*n)/(n-1||1),base=h-13,top=4;
  c.clearRect(0,0,w,h);arr.forEach((x,i)=>{const bx=i*(bw+gap),bh=(x.v/100)*(base-top);c.fillStyle=colorAbs(x.v);
    c.beginPath();c.roundRect?c.roundRect(bx,base-bh,bw,bh,3):c.rect(bx,base-bh,bw,bh);c.fill();
    c.fillStyle=cssv('--text');c.font='9px sans-serif';c.textAlign='center';c.fillText(x.v,bx+bw/2,base-bh-10<0?base-bh+9:base-bh-2);

  metric:k=>{S.dim=k;S.disagree=false;dis.classList.remove('on');[...tg.children].forEach(x=>x.classList.toggle('active',x.textContent===((METRICS.find(m=>m.key===k)||{}).label)));updateRange();updateLegend();},
  hover:c=>{const t=tiles.find(x=>x.id==='z:'+c||x.id==='l:'+c);if(t){hoverId=t.id;tipXY=[innerWidth/2,innerHeight*0.62];showTip(t.node,true);}},
  settle:()=>{updateRange();for(const t of tiles){t.cx=t.tx;t.cy=t.ty;t.cw=t.tw;t.ch=t.th;t.alpha=matches(t)?1:.12;const c=tileRGB(t);t.cr=c[0];t.cg=c[1];t.cb=c[2];t.hl=(t.id===hoverId?1:0);}const r=radarT();for(let i=0;i<6;i++)radarCur[i]=r[i];draw();drawRadar(document.getElementById('radarc'),radarCur);if(S.drill){const g=ALLZ.find(x=>x.code===S.drill);if(g){drawRadar(document.getElementById('dvradar'),DIMKEYS.map(k=>g.dims[k]||0));drawBars(document.getElementById('dvbars'),g);}}}};
})();}
</script>
