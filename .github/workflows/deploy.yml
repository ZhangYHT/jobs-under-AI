name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的主分支是 master，记得改成 master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site # 这里指定你的 HTML 所在的文件夹！
          branch: onlysite # 自动推送到这个分支
